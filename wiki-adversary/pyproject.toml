[project]
name = "wiki-adversary"
version = "0.1.0"
description = "Adversarial self-hardening LLM wiki (Cognee x Redis hackathon 2026-05-16)"
requires-python = ">=3.10"
dependencies = [
    "cognee[redis]>=0.1",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wiki_adversary"]
